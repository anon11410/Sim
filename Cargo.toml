[package]
name = "sim"
version = "0.1.0"
edition = "2024"

[dependencies]
rand      = { version = "0.10.2", default-features = false, features = ["std", "chacha"] }
serde     = { version = "1.0.229", features = ["derive"] }
toml      = "1.1.4"
# Pinned by the reproducibility contract, NOT by an API constraint. The comment
# here used to read "NOT 0.11 -- 0.11's digest type has no LowerHex impl
# (D-25)", which `config_hash` in src/config.rs contradicts in as many words:
# it builds the hex byte by byte precisely "so the idiom survives a future sha2
# major bump", and never touches a LowerHex impl on the digest type. Blocking an
# upgrade for a reason the code went out of its way to neutralise leaves the next
# reader believing a constraint that does not exist. The caret range already
# excludes 0.11; the lockfile is what actually pins the build, and a major bump
# gets reviewed like any other.
sha2      = "0.10.9"
thiserror = "2.0.20"
clap      = { version = "4.6.6", features = ["derive"] }
anyhow    = "1.0.104"
# The log seam (TICK-03/TICK-04). `csv` writes the fixed-schema per-tick
# series; `serde_json` writes the heterogeneous event stream and backs the
# schema emitter's type probe. Both take DEFAULT features. serde_json's
# map-ordering feature in particular is deliberately NOT enabled: it swaps the
# map behind `Value` from a `BTreeMap` to an `IndexMap`, and cargo unifies
# features across the graph, so enabling it here would be a byte-shape change
# any future dependency could then impose. The feature is named in
# 03-RESEARCH.md rather than here on purpose: the guard on it greps this file
# for the literal name, so a mention in a comment is indistinguishable from an
# enablement and would trip it.
csv        = "1.4.0"
serde_json = "1.0.151"

[dev-dependencies]
proptest = "1.11.0"
# Process-level tests only, and they must stay dev-only: a normal edge would
# put `getrandom` on the behaviour path and turn tests/toolchain.sh check 4
# red. `assert_cmd` drives the cross-process determinism test and the
# process-level halt, neither reachable from a library test; `predicates` is
# deliberately absent, since assert_cmd does not re-export it and the tests use
# `.assert().failure().code(1)` plus a plain `assert!` on the captured stderr.
# `tempfile` gives each run an isolated directory -- it was already in the
# resolved graph via proptest, so promoting it to a direct dev-dependency adds
# no package.
assert_cmd = "2.2.2"
tempfile   = "3.27.0"

[profile.release]
# CORE-02 / D-10: default release silently wraps i64 arithmetic. Keep `panic`
# at its default `unwind` -- `panic = "abort"` would break #[should_panic].
overflow-checks = true

[lints.clippy]
# D-21: the lists themselves live in clippy.toml (plan 01-07). An absent
# clippy.toml is an empty list, not an error.
disallowed_types   = "deny"
disallowed_methods = "deny"
